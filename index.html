<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Sayed 👋🏻</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #ffffff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
  }
  .page { position: absolute; inset: 0; transition: opacity .6s ease; }
  .page.hidden { opacity: 0; pointer-events: none; }

  svg { display: block; width: 100%; height: 100vh; }

  .field-input {
    width: 100%; height: 100%; box-sizing: border-box;
    border: none; outline: none; background: transparent;
    color: #1e293b; font-size: 15px; padding: 0 14px;
    direction: rtl;
  }
  .field-input::placeholder { color: #94a3b8; }

  .next-btn {
    width: 100%; height: 100%; border: none; border-radius: 12px;
    background: #2563eb; color: #fff; font-size: 17px;
    font-weight: bold; cursor: pointer; transition: .25s ease;
  }
  .next-btn:hover {
    background: #fff; color: #2563eb;
    box-shadow: 0 0 0 2px #2563eb inset, 0 10px 25px rgba(37,99,235,.25);
  }

  /* أنيميشن دخول الحقول */
  .anim {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .7s ease forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* أنيميشن الصورة */
  .anim-img {
    opacity: 0; transform: scale(.94);
    animation: imgIn .9s ease .2s forwards;
  }
  @keyframes imgIn {
    to { opacity: 1; transform: scale(1); }
  }

  /* أنيميشن الداشبورد */
  .dash-anim {
    opacity: 0; transform: translateY(18px);
    animation: fadeUp .6s ease forwards;
  }
</style>
</head>
<body>

<!-- ============ صفحة تسجيل الدخول ============ -->

</svg>

<script>
  const loginPage = document.getElementById('loginPage');
  const dashPage  = document.getElementById('dashPage');
  const goDash    = document.getElementById('goDash');

  goDash.addEventListener('click', () => {
    // مفيش تحقق — أي مدخلات تدخل على طول
    loginPage.classList.add('hidden');
    dashPage.classList.remove('hidden');

    // إعادة تشغيل أنيميشن الداشبورد
    document.querySelectorAll('#dashPage .dash-anim').forEach(el => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  });
</script>
