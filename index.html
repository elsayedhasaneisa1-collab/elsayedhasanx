<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Sayed 👋🏻</title>
<style>
  /* ============ إعدادات عامة ============ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background-color: #ffffff;
    color: #1e293b;
    overflow-x: hidden;
    height: 100vh;
  }

  /* ============ خلفية SVG ============ */
  .bg-svg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  /* ============ صفحة تسجيل الدخول ============ */
  .page {
    display: flex;
    height: 100vh;
    width: 100%;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .page.hidden {
    opacity: 0;
    pointer-events: none;
    position: absolute;
    transform: scale(0.98);
  }

  /* قسم الصورة (الشمال) - ربع الشاشة */
  .image-side {
    width: 25%; /* ربع الشاشة بالظبط */
    height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-left: 1px solid #e2e8f0;
    background: rgba(248, 250, 252, 0.5);
    animation: fadeRight 0.8s ease forwards;
  }

  .image-container {
    width: 100%;
    height: 85%;
    border-radius: 24px;
    overflow: hidden;
    border: 2px solid #2563eb;
    box-shadow: 0 20px 40px rgba(37, 99, 235, 0.1);
    position: relative;
  }

  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .image-side p {
    margin-top: 20px;
    color: #64748b;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
  }

  /* قسم الفورم (اليمين) */
  .form-side {
    width: 75%;
    height: 100vh;
    overflow-y: auto;
    padding: 40px 8%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .header-text {
    margin-bottom: 30px;
    animation: fadeUp 0.6s ease forwards;
    opacity: 0;
  }

  .header-text h1 {
    font-size: 38px;
    color: #0f172a;
    margin-bottom: 8px;
  }

  .header-text p {
    color: #64748b;
    font-size: 16px;
  }

  /* شبكة الحقول (كل إنبوت في كارت منفصل) */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 30px;
  }

  /* الكارت الواحد */
  .input-card {
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 14px;
    padding: 12px 16px;
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.5s ease forwards;
  }

  .input-card:hover, .input-card:focus-within {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 5px 15px rgba(37, 99, 235, 0.08);
  }

  .input-card label {
    display: block;
    font-size: 13px;
    color: #2563eb;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .input-card input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-size: 15px;
    color: #1e293b;
    padding: 4px 0;
  }

  .input-card input::placeholder {
    color: #94a3b8;
  }

  /* زرار التالي */
  .next-btn-container {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 0.8s;
  }

  .next-btn {
    width: 100%;
    padding: 16px;
    background: #2563eb;
    color: #ffffff;
    border: 2px solid #2563eb;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .next-btn:hover {
    background: #ffffff;
    color: #2563eb;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
  }

  /* ============ صفحة لوحة التحكم ============ */
  .dashboard-page {
    display: flex;
    height: 100vh;
    width: 100%;
    background: #f1f5f9;
  }

  /* السايدبار */
  .sidebar {
    width: 260px;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
  }

  .sidebar h2 {
    font-size: 24px;
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 15px;
    border-bottom: 2px solid #2563eb;
  }

  .sidebar a {
    color: #cbd5e1;
    text-decoration: none;
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 16px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar a:hover, .sidebar a.active {
    background: #2563eb;
    color: #ffffff;
  }

  /* المحتوى الرئيسي للداشبورد */
  .dashboard-content {
    flex: 1;
    padding: 30px;
    overflow-y: auto;
  }

  .dash-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }

  .dash-header h1 { color: #0f172a; font-size: 28px; }

  .dash-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }

  .dash-card {
    background: #ffffff;
    padding: 25px;
    border-radius: 18px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  }

  .dash-card h3 { color: #64748b; font-size: 15px; margin-bottom: 10px; }
  .dash-card .value { font-size: 32px; font-weight: bold; }

  /* الألوان */
  .text-blue { color: #2563eb; }
  .text-purple { color: #7c3aed; }
  .text-green { color: #16a34a; }
  .text-orange { color: #f59e0b; }

  /* أنيميشن */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* تأخير الأنيميشن للحقول */
  .input-card:nth-child(1) { animation-delay: 0.1s; }
  .input-card:nth-child(2) { animation-delay: 0.15s; }
  .input-card:nth-child(3) { animation-delay: 0.2s; }
  .input-card:nth-child(4) { animation-delay: 0.25s; }
  .input-card:nth-child(5) { animation-delay: 0.3s; }
  .input-card:nth-child(6) { animation-delay: 0.35s; }
  .input-card:nth-child(7) { animation-delay: 0.4s; }
  .input-card:nth-child(8) { animation-delay: 0.45s; }
  .input-card:nth-child(9) { animation-delay: 0.5s; }
</style>
</head>
<body>

<!-- خلفية SVG (دوائر ملونة خفيفة) -->
<svg class="bg-svg" xmlns="http://www.w3.org/2000/svg">
  <circle cx="90%" cy="10%" r="300" fill="#2563eb" opacity="0.04"/>
  <circle cx="10%" cy="90%" r="400" fill="#7c3aed" opacity="0.04"/>
</svg>

<!-- ============ صفحة تسجيل الدخول ============ -->
<div class="page" id="loginPage">
  
  <!-- الشمال: الصورة (25% من الشاشة) -->
  <div class="image-side">
    <div class="image-container">
      <!-- غير الصورة باسم sayed.png -->
      <img src="sayed.png" alt="Sayed">
    </div>
    <p>Sayed • Web Developer</p>
  </div>

  <!-- اليمين: الفورم -->
  <div class="form-side">
    <div class="header-text">
      <h1>Welcome Sayed 👋🏻</h1>
      <p>سجّل بياناتك للدخول</p>
    </div>

    <div class="form-grid">
      <div class="input-card">
        <label>📱 رقم الهاتف</label>
        <input type="tel" placeholder="01xxxxxxxxx" />
      </div>
      <div class="input-card">
        <label>🔒 كلمة المرور</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <div class="input-card">
        <label>✉️ الإيميل</label>
        <input type="email" placeholder="you@email.com" />
      </div>
      <div class="input-card">
        <label>👩 اسم أمك</label>
        <input type="text" placeholder="اسم أمك" />
      </div>
      <div class="input-card">
        <label>💘 اسم الكراش</label>
        <input type="text" placeholder="اسم الكراش" />
      </div>
      <div class="input-card">
        <label>👵 اسم خالتك</label>
        <input type="text" placeholder="اسم خالتك" />
      </div>
      <div class="input-card">
        <label>💔 اسم الإكس رقم 13</label>
        <input type="text" placeholder="اسم الإكس رقم 13" />
      </div>
      <div class="input-card">
        <label>🤝 اسم أعز صاحب ليك</label>
        <input type="text" placeholder="اسم أعز صاحب ليك" />
      </div>
      <div class="input-card" style="grid-column: span 2;">
        <label>🎯 إيه هوايتك المفضلة</label>
        <input type="text" placeholder="هوايتك المفضلة" />
      </div>
    </div>

    <div class="next-btn-container">
      <button class="next-btn" id="goDash">التالي ←</button>
    </div>
  </div>
</div>

<!-- ============ صفحة لوحة التحكم المزيفة ============ -->
<div class="page hidden" id="dashPage">
  <div class="dashboard-page">
    
    <!-- السايدبار (يمين) -->
    <div class="sidebar">
      <h2>Sayed Admin</h2>
      <a href="#" class="active">🏠 الرئيسية</a>
      <a href="#">📊 الإحصائيات</a>
      <a href="#">👥 المستخدمين</a>
      <a href="#">💬 الرسائل</a>
      <a href="#">⚙️ الإعدادات</a>
    </div>

    <!-- المحتوى (شمال) -->
    <div class="dashboard-content">
      <div class="dash-header">
        <h1>لوحة التحكم</h1>
        <span>👤 Sayed</span>
      </div>

      <!-- الكروت -->
      <div class="dash-cards">
        <div class="dash-card">
          <h3>الزيارات</h3>
          <div class="value text-blue">12,480</div>
        </div>
        <div class="dash-card">
          <h3>المستخدمين</h3>
          <div class="value text-purple">3,204</div>
        </div>
        <div class="dash-card">
          <h3>الأرباح</h3>
          <div class="value text-green">$8,950</div>
        </div>
        <div class="dash-card">
          <h3>الطلبات</h3>
          <div class="value text-orange">742</div>
        </div>
      </div>

      <!-- الرسم البياني SVG -->
      <div class="dash-card" style="margin-bottom: 20px;">
        <h3>نمو الزيارات</h3>
        <svg viewBox="0 0 800 200" style="width: 100%; height: 200px; margin-top: 20px;">
          <defs>
            <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2563eb"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient>
          </defs>
          <!-- أعمدة -->
          <rect x="50" y="120" width="40" height="80" rx="6" fill="url(#barGrad)"/>
          <rect x="150" y="90" width="40" height="110" rx="6" fill="url(#barGrad)"/>
          <rect x="250" y="60" width="40" height="140" rx="6" fill="url(#barGrad)"/>
          <rect x="350" y="100" width="40" height="100" rx="6" fill="url(#barGrad)"/>
          <rect x="450" y="40" width="40" height="160" rx="6" fill="url(#barGrad)"/>
          <rect x="550" y="70" width="40" height="130" rx="6" fill="url(#barGrad)"/>
          <rect x="650" y="20" width="40" height="180" rx="6" fill="url(#barGrad)"/>
        </svg>
      </div>

    </div>
  </div>
</div>

<script>
  const loginPage = document.getElementById('loginPage');
  const dashPage = document.getElementById('dashPage');
  const btn = document.getElementById('goDash');

  btn.addEventListener('click', () => {
    // مفيش تحقق خالص، أي مدخلات هتدخل
    loginPage.classList.add('hidden');
    dashPage.classList.remove('hidden');
  });
</script>

</body>
</html>
